<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KDakin-Dev | Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d1117;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: block;
        }

        .content-layer {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            pointer-events: none; 
            height: 100%;
            overflow-y: auto; /* Чтобы контент можно было скроллить отдельно */
        }

        .card {
            pointer-events: auto; 
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 24px;
            color: #c9d1d9;
        }

        h1, h2 { color: #58a6ff; margin-top: 0; }
        p { line-height: 1.6; color: #8b949e; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="content-layer">
        <div class="card">
            <h1>KDakin-Dev</h1>
            <p>Проектирование систем, архитектура, симуляции динамических сред.</p>
        </div>

        <div class="card">
            <h2>Проекты & Технологии</h2>
            <p>Здесь можно подробно расписать стек технологий, архитектурные паттерны и запущенные проекты.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const mouse = {
            x: null,
            y: null,
            radius: 120
        };

        // Корректная установка размеров без деформаций
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }

        window.addEventListener('resize', resize);
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Класс частицы
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            
            // Отрисовка
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            
            // Расчет физики движения и границ экрана
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                // Проверка взаимодействия с мышью (отталкивание)
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < mouse.radius + this.size) {
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) {
                        this.x += 3;
                    }
                    if (mouse.x > this.x && this.x > this.size * 10) {
                        this.x -= 3;
                    }
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) {
                        this.y += 3;
                    }
                    if (mouse.y > this.y && this.y > this.size * 10) {
                        this.y -= 3;
                    }
                }
                
                // Обычное движение
                this.x += this.directionX;
                this.y += this.directionY;
                
                this.draw();
            }
        }

        // Инициализация пула частиц
        function init() {
            particlesArray = [];
            // Фиксированное адекватное количество частиц от площади экрана
            let numberOfParticles = Math.floor((canvas.width * canvas.height) / 9000);
            if (numberOfParticles > 150) numberOfParticles = 150; // Защита от перегрузки на ультрашироких мониторах
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((window.innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((window.innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 0.4) - 0.2;
                let directionY = (Math.random() * 0.4) - 0.2;
                let color = 'rgba(88, 166, 255, 0.4)';

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // Отрисовка линий между близкими частицами
        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = dx * dx + dy * dy; // Считаем квадрат дистанции без дорогого Math.sqrt

                    if (distance < (canvas.width / 10) * (canvas.height / 10)) {
                        let opacity = 1 - (distance / 12000);
                        if (opacity > 0) {
                            ctx.strokeStyle = `rgba(88, 166, 255, ${opacity * 0.15})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                            ctx.stroke();
                        }
                    }
                }
            }
        }

        // Добавление новых частиц при клике
        window.addEventListener('click', (e) => {
            for (let i = 0; i < 8; i++) {
                let size = (Math.random() * 2) + 1;
                let directionX = (Math.random() * 2) - 1;
                let directionY = (Math.random() * 2) - 1;
                particlesArray.push(new Particle(e.clientX, e.clientY, directionX, directionY, size, 'rgba(88, 166, 255, 0.7)'));
            }
            // Убираем старые, чтобы не копились бесконечно
            if (particlesArray.length > 200) {
                particlesArray.splice(0, 8);
            }
        });

        // Главный цикл анимации
        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
            requestAnimationFrame(animate);
        }

        // Старт
        resize();
        animate();
    </script>
</body>
</html>
